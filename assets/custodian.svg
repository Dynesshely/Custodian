<?xml version="1.0" encoding="UTF-8"?>
<!--
  Custodian 应用图标（矢量源，1024x1024 设计坐标）
  底板：squircle（|x|^4.6 + |y|^4.6 = 1，16 段三次贝塞尔），#2E8BF7 -> #0F4C9C 纵向渐变，
        顶部 8% 白内高光；无描边、无外发光。
  符号（沙盒家族）：白色盒身（上宽 0.56S、下宽 0.50S、高 0.225S 的圆角梯形）
        + 白色上沿（宽 0.60S、厚 0.062S、圆角 0.025S，与盒身之间留 0.018S 底板蓝结构缝）
        + 金沙（#F5C342，宽 0.50S，露出上沿 0.10S、下缘在缝里溢出 0.008S，顶边起拱 0.03S）
  光栅由 tools/IconForge 用同一几何生成：generate / inspect / verify。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Custodian</title>
  <desc>蓝色底板上的白色沙盒，盒口盛着金沙，沙面上立着两枚应用小片</desc>

  <defs>

    <path id="sandShape" d="M 317.44 348.16 Q 512 302.08 706.56 348.16 A 61.44 61.44 0 0 1 768 409.6 L 768 445.44 A 76.8 76.8 0 0 1 691.2 522.24 L 332.8 522.24 A 76.8 76.8 0 0 1 256 445.44 L 256 409.6 A 61.44 61.44 0 0 1 317.44 348.16 Z"/>
    <path id="bodyShape" d="M 256 532.48 L 768 532.48 A 30.72 30.72 0 0 1 794.66 562.931 L 772.06 732.429 A 30.72 30.72 0 0 1 737.28 762.88 L 286.72 762.88 A 30.72 30.72 0 0 1 251.94 732.429 L 229.34 562.931 A 30.72 30.72 0 0 1 256 532.48 Z"/>
  </defs>

  <g id="icon">
    <use href="#plateShape" fill="url(#plateGradient)"/>
    <use href="#plateShape" fill="url(#plateTopHighlight)"/>

    <!-- 金沙：先画，下缘由盒身和上沿压住 -->
    <use href="#sandShape" fill="#F5C342"/>

    <!-- 盒身 -->
    <use href="#bodyShape" fill="#FFFFFF"/>

    <!-- 上沿 -->
    <rect id="rim" x="204.8" y="450.56" width="614.4" height="63.488" rx="25.6" fill="#FFFFFF"/>
  </g>
</svg>
